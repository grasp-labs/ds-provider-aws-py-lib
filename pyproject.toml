[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-provider-aws-py-lib"
version = "0.1.0-alpha.1"
description = "A Python package from the DS library collection"
dependencies = [
    "ds-resource-plugin-py-lib>=0.1.0a3,<1.0.0",
    "boto3>=1.37.0,<2.0.0",
    "botocore>=1.31.0"
]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE-APACHE"]
keywords = ["ds", "python"]
authors = [
    {name = "Grasp Labs AS", email = "hello@grasplabs.com"}
]
maintainers = [
    {name = "Grasp Labs AS", email = "hello@grasplabs.com"}
]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "PyPI.md"

[project.urls]
Documentation = "https://grasp-labs.github.io/ds-provider-aws-py-lib/"
Repository = "https://github.com/grasp-labs/ds-provider-aws-py-lib/"
Issues = "https://github.com/grasp-labs/ds-provider-aws-py-lib/issues/"
Changelog = "https://github.com/grasp-labs/ds-provider-aws-py-lib/releases"

[project.entry-points."ds.providers"]
aws = "ds_provider_aws_py_lib" # todo

[project.optional-dependencies] # todo
dev = [
    "bandit>=1.9.3",
    "boto3-stubs~=1.42.30",
    "ruff>=0.1.8",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pre-commit>=3.6.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "sphinx>=7.1.0",
    "sphinx-autoapi>=3.0.0",
    "sphinx-material>=0.0.35",
]
test = [
    "bandit>=1.9.3",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
]
docs = [
    "sphinx>=7.1.0",
    "sphinx-autoapi>=3.0.0",
    "sphinx-material>=0.0.35",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
ds_provider_aws_py_lib = ["resource.yaml", "py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
